name: CasePath production readback

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-readback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify live public CasePath projection
        env:
          EXPECTED_MARKER: "Start Your Case"
        run: |
          set +e
          curl --location --silent --show-error --fail \
            --connect-timeout 15 --max-time 45 \
            --dump-header casepath-response-headers.txt \
            --output casepath-public.html \
            https://casepath.com.au/
          CURL_STATUS=$?
          export CURL_STATUS
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          body = Path('casepath-public.html').read_bytes() if Path('casepath-public.html').exists() else b''
          text = body.decode('utf-8', errors='replace')
          marker = os.environ.get('EXPECTED_MARKER', 'Start Your Case')
          receipt = {
              'url': 'https://casepath.com.au/',
              'curl_exit_code': int(os.environ.get('CURL_STATUS', '1')),
              'http_body_bytes': len(body),
              'sha256': hashlib.sha256(body).hexdigest() if body else None,
              'expected_marker': marker,
              'marker_present': marker in text,
              'headers_file_present': Path('casepath-response-headers.txt').exists(),
          }
          Path('casepath-public-readback.json').write_text(json.dumps(receipt, indent=2) + '\\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
          if [ "$CURL_STATUS" -ne 0 ]; then exit "$CURL_STATUS"; fi
          grep -Fq "$EXPECTED_MARKER" casepath-public.html || exit 3

      - name: Verify public runtime carrier
        run: |
          curl --location --silent --show-error --fail --connect-timeout 15 --max-time 30 \
            https://raw.githubusercontent.com/aboudykeddeh276-stack/CASEPATH/main/runtime/kex-node/index.html \
            -o runtime-index.html
          curl --location --silent --show-error --fail --connect-timeout 15 --max-time 30 \
            https://raw.githubusercontent.com/aboudykeddeh276-stack/CASEPATH/main/runtime/kex-node/runtime.js \
            -o runtime.js
          grep -Fq "KEX Node Runtime" runtime-index.html
          grep -Fq "instantiate" runtime.js

      - name: Publish readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casepath-public-readback
          path: |
            casepath-public-readback.json
            casepath-response-headers.txt
            casepath-public.html
            runtime-index.html
            runtime.js
          if-no-files-found: warn
